<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5c47">
  <title>Conversa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topo">
      <img id="avatar" class="avatar" alt="">
      <div>
        <strong id="nome"></strong>
        <span class="status"><i></i><span id="status">online</span></span>
      </div>
      <div class="progresso"><div id="progresso-barra"></div></div>
    </header>

    <section id="chat" class="chat" aria-live="polite">
      <div class="dia">HOJE</div>
    </section>

    <section id="painel" class="painel" hidden>
      <div id="dica" class="dica"><span></span><b>↓</b></div>
      <div id="opcoes" class="opcoes"></div>
      <button id="voltar" class="voltar" type="button" hidden>← Voltar às opções</button>
    </section>

    <footer class="rodape">Registramos etapas e cliques, sem guardar o conteúdo das respostas.</footer>
  </main>

  <div id="lightbox" class="lightbox" hidden><img alt=""></div>

  <script src="roteiro.js"></script>
  <script src="app.js"></script>
</body>
</html>
